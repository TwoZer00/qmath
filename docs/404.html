<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Mathpex</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0f; color: #e8eaf0;
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 24px; text-align: center; padding: 20px;
    }
    .lcd {
      background: #9db89a; border: 2px solid #6a8f6a;
      border-bottom: 4px solid #8aab78; border-radius: 4px;
      padding: 24px 32px;
    }
    .lcd-num { font-family: 'Bebas Neue', sans-serif; font-size: 72px; color: #1a2e1a; letter-spacing: 4px; line-height: 1; }
    .lcd-msg { font-size: 12px; color: #4a6b4a; letter-spacing: 2px; margin-top: 8px; }
    a {
      font-size: 12px; letter-spacing: 2px; color: #a0c4ff;
      text-decoration: none; border: 1px solid #3a3f55;
      padding: 10px 24px; border-radius: 4px;
    }
    a:hover { border-color: #a0c4ff; }
  </style>
</head>
<body>
  <div class="lcd">
    <div class="lcd-num">404</div>
    <div class="lcd-msg">PAGE NOT FOUND</div>
  </div>
  <a href="/">← BACK TO HOME</a>
</body>
</html>
